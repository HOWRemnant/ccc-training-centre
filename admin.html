<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CCC Formation Centre — Admin Dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600;700&family=Cormorant+Garamond:ital,wght@0,300;0,400;1,400&family=EB+Garamond:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
:root {
  --black:#080a0f; --black-2:#0d1117; --black-3:#141920; --black-4:#1c2332; --black-5:#242e42;
  --gold:#c9a84c; --gold-l:#e8c87a; --gold-ll:#f5da82; --gold-d:#7a5c1e;
  --cream:#f6f0e5; --grey-1:#8a9ab5; --grey-2:#5a6a80;
  --green:#4caf77; --red:#e05555; --amber:#e09055;
  --sb-w:260px; --tb-h:58px;
}
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth}
body{font-family:'EB Garamond',Georgia,serif;font-size:15px;line-height:1.7;background:var(--black-2);color:var(--cream);overflow-x:hidden}
a{text-decoration:none;color:inherit}
button{cursor:pointer;border:none;font-family:inherit}
input,select,textarea{font-family:inherit}
::-webkit-scrollbar{width:5px}::-webkit-scrollbar-track{background:var(--black-3)}::-webkit-scrollbar-thumb{background:var(--gold-d);border-radius:3px}
@keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
.fade-in{animation:fadeIn .35s ease both}

/* ── LAYOUT ── */
#app{display:flex;min-height:100vh}

/* ── SIDEBAR ── */
.sidebar{position:fixed;top:0;left:0;bottom:0;width:var(--sb-w);background:var(--black);border-right:.5px solid rgba(201,168,76,.2);display:flex;flex-direction:column;z-index:300;overflow-y:auto}
.sb-logo{padding:1.2rem 1.4rem;border-bottom:.5px solid rgba(201,168,76,.12);display:flex;align-items:center;gap:10px;flex-shrink:0}
.sb-crest{width:34px;height:34px;flex-shrink:0}.sb-crest svg{width:100%;height:100%}
.sb-title{font-family:'Cinzel',serif;font-size:9px;font-weight:700;color:var(--gold);letter-spacing:.18em;text-transform:uppercase}
.sb-sub{font-family:'EB Garamond',serif;font-size:10px;font-style:italic;color:rgba(255,255,255,.35)}
.sb-admin-badge{background:var(--red);color:#fff;font-family:'Cinzel',serif;font-size:7px;letter-spacing:.1em;padding:2px 7px;border-radius:3px;margin-top:2px;display:inline-block}
.sb-nav{flex:1;padding:.8rem 0}
.sb-label{font-family:'Cinzel',serif;font-size:7.5px;letter-spacing:.28em;text-transform:uppercase;color:var(--gold-d);padding:.8rem 1.3rem .3rem;display:block}
.sb-item{display:flex;align-items:center;gap:9px;padding:.62rem 1.3rem;font-family:'Cinzel',serif;font-size:9px;letter-spacing:.1em;text-transform:uppercase;color:rgba(255,255,255,.5);transition:all .2s;border-left:2px solid transparent;cursor:pointer}
.sb-item:hover{color:var(--gold-l);background:rgba(201,168,76,.05);border-left-color:rgba(201,168,76,.3)}
.sb-item.active{color:var(--gold-l);background:rgba(201,168,76,.1);border-left-color:var(--gold)}
.sb-item svg{width:14px;height:14px;opacity:.7;flex-shrink:0}
.sb-item.active svg{opacity:1}
.sb-badge{margin-left:auto;background:var(--gold);color:var(--black);font-family:'Cinzel',serif;font-size:7px;padding:2px 6px;border-radius:8px}
.sb-badge.alert{background:var(--red)}
.sb-footer{padding:.9rem 1.3rem;border-top:.5px solid rgba(201,168,76,.12);flex-shrink:0;display:flex;align-items:center;gap:.7rem}
.sb-avatar{width:30px;height:30px;border-radius:50%;background:linear-gradient(135deg,var(--gold-d),var(--gold));display:flex;align-items:center;justify-content:center;font-family:'Cinzel',serif;font-size:10px;color:var(--black);font-weight:700}
.sb-user-name{font-family:'Cinzel',serif;font-size:9px;color:rgba(255,255,255,.65);letter-spacing:.06em}
.sb-logout{margin-left:auto;width:24px;height:24px;border:.5px solid rgba(201,168,76,.2);border-radius:4px;display:flex;align-items:center;justify-content:center;color:rgba(255,255,255,.35);background:none;transition:all .2s}
.sb-logout:hover{border-color:rgba(201,168,76,.5);color:var(--gold)}
.sb-logout svg{width:11px;height:11px}

/* ── TOPBAR ── */
.topbar{position:fixed;top:0;left:var(--sb-w);right:0;height:var(--tb-h);background:rgba(8,10,15,.96);backdrop-filter:blur(14px);border-bottom:.5px solid rgba(201,168,76,.16);display:flex;align-items:center;padding:0 1.6rem;gap:1rem;z-index:200}
.tb-title{font-family:'Cinzel',serif;font-size:12px;color:#fff;letter-spacing:.08em}
.tb-spacer{flex:1}
.tb-search{max-width:280px;flex:1;position:relative}
.tb-search input{width:100%;background:rgba(255,255,255,.05);border:.5px solid rgba(201,168,76,.16);border-radius:5px;padding:.45rem .9rem .45rem 2.2rem;font-family:'EB Garamond',serif;font-size:13px;color:var(--cream);outline:none;transition:border-color .2s}
.tb-search input:focus{border-color:rgba(201,168,76,.4)}
.tb-search input::placeholder{color:rgba(255,255,255,.25)}
.tb-search-icon{position:absolute;left:.65rem;top:50%;transform:translateY(-50%);width:12px;height:12px;color:rgba(255,255,255,.3)}
.tb-actions{display:flex;gap:.6rem;align-items:center}
.tb-btn{width:34px;height:34px;background:rgba(255,255,255,.04);border:.5px solid rgba(201,168,76,.14);border-radius:5px;display:flex;align-items:center;justify-content:center;color:rgba(255,255,255,.5);transition:all .2s;position:relative}
.tb-btn:hover{border-color:rgba(201,168,76,.38);color:var(--gold)}
.tb-btn svg{width:14px;height:14px}
.tb-notif{position:absolute;top:5px;right:5px;width:6px;height:6px;border-radius:50%;background:var(--red);border:1.5px solid var(--black-2)}
.tb-divider{width:.5px;height:24px;background:rgba(201,168,76,.12)}
.tb-user{display:flex;align-items:center;gap:7px;cursor:pointer}
.tb-avatar{width:32px;height:32px;border-radius:50%;background:linear-gradient(135deg,var(--gold-d),var(--gold));display:flex;align-items:center;justify-content:center;font-family:'Cinzel',serif;font-size:11px;color:var(--black);font-weight:700}

/* ── MAIN ── */
.main{margin-left:var(--sb-w);padding-top:var(--tb-h);min-height:100vh;width:calc(100% - var(--sb-w))}
.content{padding:1.6rem 1.8rem 4rem}

/* ── PAGE HEADER ── */
.pg-header{margin-bottom:1.6rem;display:flex;align-items:flex-start;justify-content:space-between;flex-wrap:wrap;gap:1rem}
.pg-title-block .pg-crumb{font-family:'Cinzel',serif;font-size:7.5px;letter-spacing:.18em;text-transform:uppercase;color:var(--grey-1);margin-bottom:.4rem;display:flex;align-items:center;gap:5px}
.pg-title-block .pg-crumb span{color:var(--gold-d)}
.pg-title{font-family:'Cinzel',serif;font-size:clamp(1.2rem,1.8vw,1.7rem);font-weight:600;color:#fff;letter-spacing:.03em;line-height:1.2}
.pg-title em{font-family:'Cormorant Garamond',serif;font-style:italic;color:var(--gold-l);font-weight:300;font-size:1.08em}
.pg-sub{font-family:'EB Garamond',serif;font-size:14px;color:var(--grey-1);margin-top:.2rem}
.pg-actions{display:flex;gap:.6rem;flex-wrap:wrap;align-items:center}

/* ── SECTION HEADER ── */
.sec-hd{display:flex;align-items:center;justify-content:space-between;margin-bottom:.9rem}
.sec-title{font-family:'Cinzel',serif;font-size:9.5px;font-weight:600;letter-spacing:.2em;text-transform:uppercase;color:#fff;display:flex;align-items:center;gap:7px}
.sec-title::before{content:'';width:14px;height:.5px;background:var(--gold);opacity:.7}
.sec-link{font-family:'Cinzel',serif;font-size:7.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--gold);cursor:pointer;transition:color .2s}
.sec-link:hover{color:var(--gold-l)}

/* ── STAT CARDS ── */
.stats-row{display:grid;grid-template-columns:repeat(5,1fr);gap:.8rem;margin-bottom:1.6rem}
.stat-card{background:var(--black-3);border:.5px solid rgba(201,168,76,.16);border-radius:8px;padding:1.2rem 1.3rem;position:relative;overflow:hidden;transition:border-color .25s}
.stat-card:hover{border-color:rgba(201,168,76,.36)}
.stat-card::before{content:'';position:absolute;top:0;left:0;right:0;height:1.5px;background:linear-gradient(to right,transparent,var(--gold),transparent);opacity:.5}
.stat-icon{font-size:1.4rem;margin-bottom:.7rem}
.stat-val{font-family:'Cinzel',serif;font-size:1.6rem;font-weight:600;color:var(--gold-l);line-height:1;margin-bottom:2px}
.stat-label{font-family:'Cinzel',serif;font-size:7.5px;letter-spacing:.15em;text-transform:uppercase;color:var(--grey-1)}
.stat-change{font-family:'EB Garamond',serif;font-size:11.5px;margin-top:.2rem}
.stat-up{color:var(--green)}.stat-down{color:var(--red)}.stat-neutral{color:var(--grey-2)}

/* ── TABLE ── */
.data-table-wrap{background:var(--black-3);border:.5px solid rgba(201,168,76,.16);border-radius:9px;overflow:hidden;margin-bottom:1.6rem}
.dt-header{display:flex;align-items:center;justify-content:space-between;padding:1rem 1.4rem;border-bottom:.5px solid rgba(201,168,76,.12);flex-wrap:wrap;gap:.7rem}
.dt-title{font-family:'Cinzel',serif;font-size:9.5px;letter-spacing:.16em;text-transform:uppercase;color:#fff}
.dt-filters{display:flex;gap:.5rem;flex-wrap:wrap}
.dt-filter{font-family:'Cinzel',serif;font-size:7.5px;letter-spacing:.1em;text-transform:uppercase;padding:.4rem .9rem;border-radius:4px;border:.5px solid rgba(201,168,76,.16);color:rgba(255,255,255,.45);background:none;transition:all .2s;cursor:pointer}
.dt-filter.active,.dt-filter:hover{border-color:rgba(201,168,76,.4);color:var(--gold-l);background:rgba(201,168,76,.08)}
.dt-search{background:rgba(255,255,255,.04);border:.5px solid rgba(201,168,76,.14);border-radius:4px;padding:.4rem .8rem;font-family:'EB Garamond',serif;font-size:13px;color:var(--cream);outline:none;width:200px;transition:border-color .2s}
.dt-search:focus{border-color:rgba(201,168,76,.35)}
.dt-search::placeholder{color:rgba(255,255,255,.25)}
table{width:100%;border-collapse:collapse}
thead th{padding:.75rem 1.1rem;font-family:'Cinzel',serif;font-size:7.5px;letter-spacing:.18em;text-transform:uppercase;color:var(--gold-d);text-align:left;background:var(--black-4);border-bottom:.5px solid rgba(201,168,76,.12);white-space:nowrap}
tbody tr{border-bottom:.5px solid rgba(255,255,255,.04);transition:background .2s}
tbody tr:hover{background:rgba(201,168,76,.04)}
tbody tr:last-child{border-bottom:none}
tbody td{padding:.75rem 1.1rem;font-family:'EB Garamond',serif;font-size:14px;color:rgba(255,255,255,.72);vertical-align:middle}
.td-name{font-family:'Cinzel',serif;font-size:11px;color:#fff;letter-spacing:.03em}
.td-email{font-family:'EB Garamond',serif;font-size:12.5px;color:var(--grey-1)}
.td-badge{display:inline-flex;align-items:center;font-family:'Cinzel',serif;font-size:7px;letter-spacing:.1em;text-transform:uppercase;padding:3px 9px;border-radius:3px}
.badge-enrolled{background:rgba(201,168,76,.12);color:var(--gold-l);border:.5px solid rgba(201,168,76,.25)}
.badge-passed{background:rgba(76,175,119,.12);color:var(--green);border:.5px solid rgba(76,175,119,.25)}
.badge-failed{background:rgba(224,85,85,.1);color:var(--red);border:.5px solid rgba(224,85,85,.2)}
.badge-cert{background:rgba(201,168,76,.2);color:var(--gold-ll);border:.5px solid rgba(201,168,76,.4)}
.badge-pending{background:rgba(255,255,255,.05);color:var(--grey-1);border:.5px solid rgba(255,255,255,.1)}
.td-action{display:inline-flex;align-items:center;gap:4px;font-family:'Cinzel',serif;font-size:7.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--gold);border:.5px solid rgba(201,168,76,.28);padding:4px 10px;border-radius:3px;background:none;cursor:pointer;transition:all .2s}
.td-action:hover{background:rgba(201,168,76,.1);border-color:rgba(201,168,76,.5)}
.td-action.danger{color:var(--red);border-color:rgba(224,85,85,.28)}
.td-action.danger:hover{background:rgba(224,85,85,.1)}
.td-action.success{color:var(--green);border-color:rgba(76,175,119,.28)}
.td-action.success:hover{background:rgba(76,175,119,.1)}
.dt-empty{text-align:center;padding:2.5rem;color:var(--grey-2);font-family:'EB Garamond',serif;font-size:14px}
.dt-footer{display:flex;align-items:center;justify-content:space-between;padding:.9rem 1.4rem;border-top:.5px solid rgba(201,168,76,.1);flex-wrap:wrap;gap:.6rem}
.dt-count{font-family:'Cinzel',serif;font-size:8px;letter-spacing:.12em;text-transform:uppercase;color:var(--grey-2)}
.dt-pagination{display:flex;gap:.4rem}
.pg-btn{width:28px;height:28px;background:rgba(255,255,255,.04);border:.5px solid rgba(201,168,76,.14);border-radius:4px;display:flex;align-items:center;justify-content:center;font-family:'Cinzel',serif;font-size:8px;color:rgba(255,255,255,.5);cursor:pointer;transition:all .2s}
.pg-btn:hover,.pg-btn.active{border-color:rgba(201,168,76,.4);color:var(--gold);background:rgba(201,168,76,.08)}

/* ── BUTTONS ── */
.btn{display:inline-flex;align-items:center;gap:6px;font-family:'Cinzel',serif;font-size:8.5px;letter-spacing:.15em;text-transform:uppercase;padding:9px 18px;border-radius:5px;border:none;cursor:pointer;transition:all .2s;white-space:nowrap}
.btn-gold{background:var(--gold);color:var(--black)}.btn-gold:hover{background:var(--gold-l);transform:translateY(-1px)}
.btn-outline{background:transparent;color:var(--gold);border:.5px solid rgba(201,168,76,.38)}.btn-outline:hover{background:rgba(201,168,76,.08)}
.btn-ghost{background:rgba(255,255,255,.05);color:rgba(255,255,255,.6);border:.5px solid rgba(255,255,255,.1)}.btn-ghost:hover{border-color:rgba(201,168,76,.3);color:var(--gold)}
.btn-danger{background:rgba(224,85,85,.15);color:var(--red);border:.5px solid rgba(224,85,85,.28)}.btn-danger:hover{background:rgba(224,85,85,.25)}
.btn-success{background:rgba(76,175,119,.15);color:var(--green);border:.5px solid rgba(76,175,119,.28)}.btn-success:hover{background:rgba(76,175,119,.25)}
.btn-sm{padding:6px 12px;font-size:7.5px}
.btn-icon{width:32px;height:32px;padding:0;justify-content:center}
.btn svg{width:13px;height:13px}

/* ── TWO COL ── */
.two-col{display:grid;grid-template-columns:1fr 320px;gap:1.2rem;margin-bottom:1.6rem}
.three-col{display:grid;grid-template-columns:repeat(3,1fr);gap:1rem;margin-bottom:1.6rem}

/* ── PANEL CARD ── */
.panel{background:var(--black-3);border:.5px solid rgba(201,168,76,.16);border-radius:9px;overflow:hidden;margin-bottom:1.4rem}
.panel-header{padding:1rem 1.4rem;border-bottom:.5px solid rgba(201,168,76,.12);display:flex;align-items:center;justify-content:space-between}
.panel-title{font-family:'Cinzel',serif;font-size:9.5px;letter-spacing:.16em;text-transform:uppercase;color:#fff}
.panel-body{padding:1.4rem}

/* ── FORM ── */
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:.8rem;margin-bottom:.8rem}
.form-group{margin-bottom:.8rem}
.form-label{font-family:'Cinzel',serif;font-size:7.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--gold-d);display:block;margin-bottom:.35rem}
.form-input,.form-select{width:100%;background:rgba(255,255,255,.05);border:.5px solid rgba(201,168,76,.16);border-radius:5px;padding:.6rem .9rem;font-family:'EB Garamond',serif;font-size:14px;color:var(--cream);outline:none;transition:border-color .2s}
.form-input:focus,.form-select:focus{border-color:rgba(201,168,76,.42)}
.form-input::placeholder{color:rgba(255,255,255,.25)}
.form-select option{background:var(--black-3)}
.form-actions{display:flex;gap:.6rem;justify-content:flex-end;padding-top:.6rem}

/* ── MODAL ── */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.75);backdrop-filter:blur(4px);z-index:500;display:flex;align-items:center;justify-content:center;padding:1.5rem}
.modal{background:var(--black-3);border:.5px solid rgba(201,168,76,.28);border-radius:10px;width:100%;max-width:540px;max-height:90vh;overflow-y:auto;position:relative;box-shadow:0 24px 64px rgba(0,0,0,.6)}
.modal::before{content:'';position:absolute;top:0;left:0;right:0;height:1.5px;background:linear-gradient(to right,transparent,var(--gold),transparent);border-radius:10px 10px 0 0}
.modal-header{padding:1.4rem 1.6rem;border-bottom:.5px solid rgba(201,168,76,.12);display:flex;align-items:center;justify-content:space-between}
.modal-title{font-family:'Cinzel',serif;font-size:12px;color:#fff;letter-spacing:.06em}
.modal-close{background:none;border:none;color:rgba(255,255,255,.4);font-size:1.3rem;cursor:pointer;transition:color .2s;padding:0}
.modal-close:hover{color:var(--gold)}
.modal-body{padding:1.6rem}
.modal-footer{padding:1rem 1.6rem;border-top:.5px solid rgba(201,168,76,.1);display:flex;justify-content:flex-end;gap:.6rem}

/* ── CHARTS (CSS-only) ── */
.mini-bar-chart{display:flex;flex-direction:column;gap:.5rem}
.mbc-row{display:flex;align-items:center;gap:.7rem}
.mbc-label{font-family:'Cinzel',serif;font-size:8px;letter-spacing:.08em;text-transform:uppercase;color:var(--grey-1);width:120px;flex-shrink:0}
.mbc-bar-wrap{flex:1;background:rgba(255,255,255,.05);border-radius:3px;height:18px;overflow:hidden;position:relative}
.mbc-bar{height:100%;background:linear-gradient(to right,var(--gold-d),var(--gold));border-radius:3px;transition:width .6s ease;display:flex;align-items:center;padding-left:.5rem}
.mbc-val{font-family:'Cinzel',serif;font-size:7.5px;color:var(--black);font-weight:600}
.mbc-count{font-family:'Cinzel',serif;font-size:8.5px;color:var(--gold-l);width:32px;text-align:right;flex-shrink:0}
.activity-item{display:flex;align-items:flex-start;gap:.8rem;padding:.65rem 0;border-bottom:.5px solid rgba(255,255,255,.05)}
.activity-item:last-child{border-bottom:none}
.act-dot{width:7px;height:7px;border-radius:50%;flex-shrink:0;margin-top:5px}
.act-dot.enroll{background:var(--gold);border:1.5px solid var(--gold-l)}
.act-dot.complete{background:var(--green);border:1.5px solid #7dffaa}
.act-dot.cert{background:var(--amber);border:1.5px solid #ffd080}
.act-dot.payment{background:#88aaff;border:1.5px solid #aaccff}
.act-text{font-family:'EB Garamond',serif;font-size:13.5px;color:rgba(255,255,255,.6);line-height:1.5;flex:1}
.act-text strong{color:var(--gold-l)}
.act-time{font-family:'Cinzel',serif;font-size:7px;letter-spacing:.09em;text-transform:uppercase;color:var(--grey-2);margin-top:2px;white-space:nowrap}

/* ── LIBRARY ADMIN ── */
.lib-admin-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:1rem;margin-bottom:1.6rem}
.lib-admin-card{background:var(--black-3);border:.5px solid rgba(201,168,76,.15);border-radius:8px;overflow:hidden;display:flex;flex-direction:column;transition:all .25s;position:relative}
.lib-admin-card:hover{border-color:rgba(201,168,76,.38)}
.lac-thumb{height:90px;background:var(--black-4);display:flex;align-items:center;justify-content:center;font-size:2.4rem;opacity:.55;position:relative;flex-shrink:0}
.lac-type{position:absolute;top:.6rem;left:.6rem;font-family:'Cinzel',serif;font-size:7px;letter-spacing:.12em;text-transform:uppercase;padding:2px 8px;border-radius:3px}
.lac-type.pdf{background:rgba(224,85,85,.18);color:#ff9999;border:.5px solid rgba(224,85,85,.3)}
.lac-type.study{background:rgba(245,180,80,.14);color:#ffd090;border:.5px solid rgba(245,180,80,.28)}
.lac-type.link{background:rgba(201,168,76,.15);color:var(--gold-l);border:.5px solid rgba(201,168,76,.3)}
.lac-type.video{background:rgba(100,160,255,.15);color:#88aaff;border:.5px solid rgba(100,160,255,.28)}
.lac-type.audio{background:rgba(200,130,255,.14);color:#ddaaff;border:.5px solid rgba(200,130,255,.28)}
.lac-type.article{background:rgba(76,175,119,.13);color:#88ddaa;border:.5px solid rgba(76,175,119,.25)}
.lac-body{padding:1rem;flex:1;display:flex;flex-direction:column}
.lac-cat{font-family:'Cinzel',serif;font-size:7px;letter-spacing:.16em;text-transform:uppercase;color:var(--gold-d);margin-bottom:.25rem}
.lac-title{font-family:'Cinzel',serif;font-size:11px;color:#fff;margin-bottom:.35rem;line-height:1.3;letter-spacing:.02em}
.lac-desc{font-family:'EB Garamond',serif;font-size:12.5px;color:rgba(255,255,255,.48);line-height:1.6;flex:1;margin-bottom:.7rem}

function initSupabase() {
  if (String(ADMIN_CONFIG.supabaseUrl).indexOf('YOUR_') === 0) {
    loadDemoData();
    return;
  }
  try {
    state.supabase = supabase.createClient(ADMIN_CONFIG.supabaseUrl, ADMIN_CONFIG.supabaseKey);
    state.supabase.auth.getSession().then(({data:{session}}) => {
      if (session) {
        state.admin = session.user;
        loadAllData().then(() => { state.loading=false; render(); });
      } else { state.loading=false; render(); }
    });
  } catch(e) { loadDemoData(); }
}

  ]);

  state.enrollments     = e.data || [];
  state.progress        = p.data || [];

}

// ── ADMIN AUTH ─────────────────────────────────────────────
async function adminLogin() {
  const e = document.getElementById('adminEmail')?.value?.trim();
  const p = document.getElementById('adminPwd')?.value;
  if (!e||!p) { state.authError='Email and password required.'; render(); return; }
  if (!state.supabase) { loadDemoData(); return; }
  const {error} = await state.supabase.auth.signInWithPassword({email:e,password:p});
  if (error) { state.authError=error.message; render(); }
}
async function adminLogout() {
  if (state.supabase) await state.supabase.auth.signOut();
  state.admin=null; state.students=[]; state.enrollments=[]; render();
}

// ── ENROLLMENT ACTIONS ─────────────────────────────────────
async function manualEnroll(userId, courseId) {
  if (!userId||!courseId) { toast('Please select a student and course.','error'); return; }
  const exists = state.enrollments.find(e=>e.user_id===userId&&e.course_id===courseId);
  if (exists) { toast('Student already enrolled in this course.','error'); return; }
  const newEnrol = {id:'e'+Date.now(),user_id:userId,course_id:courseId,enrolled_at:new Date().toISOString()};
  state.enrollments.push(newEnrol);
  if (state.supabase) {
    const {error} = await state.supabase.from('enrollments').insert({user_id:userId,course_id:courseId});
    if (error) { toast('Error enrolling: '+error.message,'error'); return; }
  }
  closeModal();
  toast('Student enrolled successfully!','success');
  render();
}

async function revokeEnrollment(enrollId) {
  if (!confirm('Remove this enrollment? This cannot be undone.')) return;
  state.enrollments = state.enrollments.filter(e=>e.id!==enrollId);
  if (state.supabase) await state.supabase.from('enrollments').delete().eq('id',enrollId);
  toast('Enrollment removed.','info'); render();
}

async function issueCertificateAdmin(userId, courseId) {
  const existing = state.certificates.find(c=>c.user_id===userId&&c.course_id===courseId);
  if (existing) { toast('Certificate already issued.','error'); return; }
  const cert = {id:'c'+Date.now(),user_id:userId,course_id:courseId,issued_at:new Date().toISOString()};
  state.certificates.push(cert);
  if (state.supabase) await state.supabase.from('certificates').insert({user_id:userId,course_id:courseId});
  toast('Certificate issued!','success'); render();
}

async function revokeCertificate(certId) {
  if (!confirm('Revoke this certificate?')) return;
  state.certificates = state.certificates.filter(c=>c.id!==certId);
  if (state.supabase) await state.supabase.from('certificates').delete().eq('id',certId);
  toast('Certificate revoked.','info'); render();
}

async function resetAssessment(userId, courseId) {
  if (!confirm('Reset this student\'s assessment score? They will need to retake it.')) return;
  state.scores = state.scores.filter(s=>!(s.user_id===userId&&s.course_id===courseId));
  if (state.supabase) await state.supabase.from('assessment_scores').delete().eq('user_id',userId).eq('course_id',courseId);
  toast('Assessment reset. Student can retake.','info'); render();
}

function ccEsc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}

// Decorative border: double frames, woven "guilloche" bands on all four sides, corner rosettes.
function ccBorderSVG(W,H){
  var G='#c9a84c',D='#9a6f1a',p=[];
  function rect(x,y,w,h,sw,op){p.push('<rect x="'+x+'" y="'+y+'" width="'+w+'" height="'+h+'" fill="none" stroke="'+G+'" stroke-width="'+sw+'" opacity="'+op+'"/>');}
  rect(8,8,W-16,H-16,5,1);
  rect(18,18,W-36,H-36,1,.75);
  rect(86,86,W-172,H-172,1.4,.9);
  rect(91,91,W-182,H-182,.5,.55);
  function band(c,from,to,horizontal){
    var N=7,A=10,wl=64,steps=Math.round((to-from)/3);
    for(var s=0;s<N;s++){
      var ph=s*Math.PI*2/N,pts=[];
      for(var i=0;i<=steps;i++){
        var t=from+(to-from)*i/steps,u=(t-from)/wl*Math.PI*2;
        var off=A*Math.sin(u+ph)*(0.62+0.38*Math.cos(u*0.5+ph*0.5));
        pts.push(horizontal?(t.toFixed(1)+','+(c+off).toFixed(1)):((c+off).toFixed(1)+','+t.toFixed(1)));
      }
      p.push('<polyline points="'+pts.join(' ')+'" fill="none" stroke="'+(s%2?D:G)+'" stroke-width=".7" opacity="'+(s%2?.6:.85)+'"/>');
    }
  }
  band(52,104,W-104,true); band(H-52,104,W-104,true);
  band(52,104,H-104,false); band(W-52,104,H-104,false);
  function rosette(cx,cy){
    var rho=15,i,a;
    p.push('<circle cx="'+cx+'" cy="'+cy+'" r="37" fill="#fbf5e6" stroke="'+G+'" stroke-width="1.6"/>');
    p.push('<circle cx="'+cx+'" cy="'+cy+'" r="33" fill="none" stroke="'+G+'" stroke-width=".6" opacity=".8"/>');
    for(i=0;i<18;i++){a=i*Math.PI*2/18;
      p.push('<circle cx="'+(cx+rho*Math.cos(a)).toFixed(2)+'" cy="'+(cy+rho*Math.sin(a)).toFixed(2)+'" r="'+rho+'" fill="none" stroke="'+(i%2?D:G)+'" stroke-width=".55" opacity=".85"/>');}
    for(i=0;i<12;i++){a=i*Math.PI*2/12+Math.PI/12;
      p.push('<circle cx="'+(cx+8*Math.cos(a)).toFixed(2)+'" cy="'+(cy+8*Math.sin(a)).toFixed(2)+'" r="8" fill="none" stroke="'+G+'" stroke-width=".45" opacity=".7"/>');}
    p.push('<circle cx="'+cx+'" cy="'+cy+'" r="9" fill="url(#ccg)" stroke="'+D+'" stroke-width=".8"/>');
    p.push('<circle cx="'+cx+'" cy="'+cy+'" r="3.4" fill="#fff6d8" opacity=".9"/>');
  }
  rosette(52,52);rosette(W-52,52);rosette(52,H-52);rosette(W-52,H-52);
  [[W/2,13],[W/2,H-13],[13,H/2],[W-13,H/2]].forEach(function(d){
    p.push('<polygon points="'+d[0]+','+(d[1]-6)+' '+(d[0]+6)+','+d[1]+' '+d[0]+','+(d[1]+6)+' '+(d[0]-6)+','+d[1]+'" fill="'+G+'"/>');});
  return '<svg viewBox="0 0 '+W+' '+H+'" xmlns="http://www.w3.org/2000/svg"><defs><radialGradient id="ccg" cx="35%" cy="30%" r="80%"><stop offset="0" stop-color="#f4dc92"/><stop offset="1" stop-color="#a8791f"/></radialGradient></defs>'+p.join('')+'</svg>';
}

// o = { name, title, school, number, issued, award, gradeLine, verifyUrl, logo, preview }
function ccCertificateHTML(o){
  var issued=new Date(o.issued||Date.now()).toLocaleDateString('en-GB',{day:'numeric',month:'long',year:'numeric'});

function ccVerifyUrl(number){
  return location.href.replace(/[#?].*$/,'').replace(/[^\/]*$/,'')+'verify.html?c='+encodeURIComponent(number);
}

function ccOpenCertificate(html){
  try{
    var blob=new Blob([html],{type:'text/html'});
    var url=URL.createObjectURL(blob);
    var w=window.open(url,'_blank');
    if(!w){
      var a=document.createElement('a');a.href=url;a.target='_blank';a.rel='noopener';
      document.body.appendChild(a);a.click();setTimeout(function(){try{document.body.removeChild(a);}catch(e){}},1000);
    }
    setTimeout(function(){URL.revokeObjectURL(url);},120000);
    toast('Certificate opened. Use the Print button to save it as a PDF.','success',5000);
  }catch(e){
    var w2=window.open('','_blank');
    if(w2){w2.document.write(html);w2.document.close();}
    else toast('Please allow pop-ups to open your certificate.','error',5000);
  }
}

  function downloadAdminCertificate(userId, courseId) {
    const student=state.students.find(s=>s.id===userId);
    const course=COURSE_LIST.find(c=>c.id===courseId);
    const cert=state.certificates.find(c=>c.user_id===userId&&c.course_id===courseId);

    const scoreObj=(state.scores||[]).find(s=>s.user_id===userId&&s.course_id===courseId);
    const score=scoreObj?scoreObj.score:0;
    const grade=score>=90?'Distinction':score>=80?'Merit':'Pass';
    const isCore=!!course.core;
    const number=cert.certificate_num||'';
    const live=!!state.supabase&&!!number;
    ccOpenCertificate(ccCertificateHTML({
      name:student.full_name||'Student',title:course.title,school:course.school,number:number,
      issued:cert.issued_at,award:isCore?'Certificate of Completion':'Certificate of Achievement',
      gradeLine:isCore?'Core Training \u00B7 All Modules Passed':(score>0?'Grade: '+grade+' \u00B7 Score: '+score+'%':''),
      verifyUrl:ccVerifyUrl(number),logo:CCC_LOGO,preview:!live}));
  }


function exportCSV(type) {
  let csv='', filename='';
  if (type==='students') {
    csv = 'Name,Email,Joined,Enrollments,Certificates\n' +
      state.students.map(s=>{
        const enrCount = state.enrollments.filter(e=>e.user_id===s.id).length;
        const certCount = state.certificates.filter(c=>c.user_id===s.id).length;
        return `"${s.full_name}","${s.email}","${new Date(s.created_at).toLocaleDateString()}",${enrCount},${certCount}`;
      }).join('\n');
    filename = 'ccc-students.csv';
  } else if (type==='enrollments') {
    csv = 'Student,Email,Course,Enrolled,Score,Passed,Certificate\n' +
      state.enrollments.map(e=>{
        const s=state.students.find(st=>st.id===e.user_id);
        const c=COURSE_LIST.find(c=>c.id===e.course_id);
        const sc=state.scores.find(sc=>sc.user_id===e.user_id&&sc.course_id===e.course_id);
        const cert=state.certificates.find(c=>c.user_id===e.user_id&&c.course_id===e.course_id);
        return `"${s?.full_name||''}","${s?.email||''}","${c?.title||e.course_id}","${new Date(e.enrolled_at).toLocaleDateString()}","${sc?.score||''}","${sc?sc.passed?'Yes':'No':''}","${cert?new Date(cert.issued_at).toLocaleDateString():''}"`;
      }).join('\n');
    filename = 'ccc-enrollments.csv';
  }
  const blob = new Blob([csv],{type:'text/csv'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href=url; a.download=filename; a.click();
  URL.revokeObjectURL(url);
  toast(`${type} exported as CSV!`,'success');
}

function toast(msg,type='info') {
  const wrap=document.getElementById('toastWrap');
  const t=document.createElement('div');
  t.className=`toast ${type}`;
  const icon=type==='success'?'&#x2713;':type==='error'?'&#x2715;':'ℹ';
  t.innerHTML=`<span>${icon}</span><span class="toast-text">${msg}</span><button class="toast-close" onclick="this.parentElement.remove()">&#x2715;</button>`;
  wrap.appendChild(t); setTimeout(()=>t.remove(),4500);
}

function relTime(iso) {
  if (!iso) return '';
  const diff = Date.now()-new Date(iso).getTime();
  const m=Math.floor(diff/60000),h=Math.floor(m/60),d=Math.floor(h/24);
  if (d>7) return new Date(iso).toLocaleDateString('en-GB',{day:'numeric',month:'short'});
  if (d>0) return `${d}d ago`; if (h>0) return `${h}h ago`; return `${m}m ago`;
}

// ── PAGE: STUDENTS ─────────────────────────────────────────
function renderStudents() {
  const q = state.studentSearch.toLowerCase();
  let students = state.students;
  if (q) students = students.filter(s=>s.full_name?.toLowerCase().includes(q)||s.email?.toLowerCase().includes(q));

  return `
  <div class="pg-header">
    <div class="pg-title-block">
      <div class="pg-crumb">Admin <span>›</span> Students</div>
      <h1 class="pg-title">Student <em>Management</em></h1>
      <p class="pg-sub">${state.students.length} registered students.</p>
    </div>
    <div class="pg-actions">
      <button class="btn btn-outline btn-sm" onclick="exportCSV('students')">${icon('download')} Export CSV</button>
      <button class="btn btn-gold btn-sm" onclick="openModal('enroll')">+ Enrol Student</button>
    </div>
  </div>
  <div class="data-table-wrap">
    <div class="dt-header">
      <div class="dt-title">All Students</div>
      <div class="dt-filters">
        <input class="dt-search" placeholder="Search name or email…" value="${state.studentSearch}" oninput="state.studentSearch=this.value;render()">
      </div>
    </div>
    <table>
      <thead><tr>
        <th>Student</th><th>Joined</th><th>Courses</th><th>Assessments</th><th>Certificates</th><th>Actions</th>
      </tr></thead>
      <tbody>
        ${students.length===0?`<tr><td colspan="6" class="dt-empty">No students found.</td></tr>`:
        students.map(s=>{
          const enrs=state.enrollments.filter(e=>e.user_id===s.id);
          const scs=state.scores.filter(sc=>sc.user_id===s.id);
          const certs=state.certificates.filter(c=>c.user_id===s.id);
          const passed=scs.filter(sc=>sc.passed).length;
          return `<tr>
            <td>
              <div class="td-name">${s.full_name}</div>
              <div class="td-email">${s.email}</div>
            </td>
            <td>${new Date(s.created_at).toLocaleDateString('en-GB',{day:'numeric',month:'short',year:'numeric'})}</td>
            <td>
              ${enrs.length>0
                ? enrs.map(e=>`<div style="display:flex;align-items:center;gap:4px;margin-bottom:2px"><span>${courseIcon(e.course_id)}</span><span style="font-family:'EB Garamond',serif;font-size:12.5px;color:rgba(255,255,255,.6)">${courseName(e.course_id).slice(0,24)}</span></div>`).join('')
                : '<span style="color:var(--grey-2);font-size:12.5px">None</span>'}
            </td>
            <td>${scs.length>0?`<span class="td-badge badge-passed">${passed} passed</span>${scs.length-passed>0?` <span class="td-badge badge-failed">${scs.length-passed} failed</span>`:''}`:'<span class="td-badge badge-pending">None</span>'}</td>
            <td>${certs.length>0?`<span class="td-badge badge-cert">&#x1F4DC; ${certs.length}</span>`:'<span class="td-badge badge-pending">None</span>'}</td>
            <td>
              <div style="display:flex;gap:.4rem;flex-wrap:wrap">
                <button class="td-action" onclick="openModal('student',${JSON.stringify(s).replace(/"/g,'&quot;')})">View</button>
                <button class="td-action success" onclick="openModal('enroll',{userId:'${s.id}'})">+ Enrol</button>
              </div>
            </td>
          </tr>`;
        }).join('')}
      </tbody>
    </table>
    <div class="dt-footer"><div class="dt-count">${students.length} student${students.length!==1?'s':''}</div></div>
  </div>`;
}

// ── PAGE: ENROLLMENTS ──────────────────────────────────────
function renderEnrollments() {
  const q = state.studentSearch.toLowerCase();
  let enrolls = state.enrollments;
  if (q) enrolls = enrolls.filter(e=>{
    const s=state.students.find(st=>st.id===e.user_id);
    const c=COURSE_LIST.find(c=>c.id===e.course_id);
    return s?.full_name?.toLowerCase().includes(q)||s?.email?.toLowerCase().includes(q)||c?.title?.toLowerCase().includes(q);
  });
  if (state.enrollFilter!=='all') enrolls=enrolls.filter(e=>e.course_id===state.enrollFilter);

  return `
  <div class="pg-header">
    <div class="pg-title-block">

    </div>
    <div class="pg-actions">
      <button class="btn btn-outline btn-sm" onclick="exportCSV('enrollments')">${icon('download')} Export CSV</button>
      <button class="btn btn-gold btn-sm" onclick="openModal('enroll')">+ Manual Enrol</button>
    </div>
  </div>
  <div class="data-table-wrap">

        <select class="form-select" style="width:auto;padding:.38rem .8rem;font-size:12px" onchange="state.enrollFilter=this.value;render()">
          <option value="all">All Courses</option>
          ${COURSE_LIST.map(c=>`<option value="${c.id}" ${state.enrollFilter===c.id?'selected':''}>${c.icon} ${c.title}</option>`).join('')}
        </select>
      </div>
    </div>
    <table>
      <thead><tr><th>Student</th><th>Course</th><th>Enrolled</th><th>Assessment</th><th>Certificate</th><th>Actions</th></tr></thead>
      <tbody>
        ${enrolls.length===0?`<tr><td colspan="6" class="dt-empty">No enrollments found.</td></tr>`:
        enrolls.map(e=>{

                ${cert?`<button class="td-action success" onclick="downloadAdminCertificate('${e.user_id}','${e.course_id}')">&#x1F4E5; PDF</button>`:''}

        }).join('')}
      </tbody>
    </table>
    <div class="dt-footer"><div class="dt-count">${enrolls.length} enrollment${enrolls.length!==1?'s':''}</div></div>
  </div>`;
}

  const failedScores = state.scores.filter(s=>!s.passed);

  return `
  <div class="pg-header">
    <div class="pg-title-block">
      <div class="pg-crumb">Admin <span>›</span> Assessments</div>
      <h1 class="pg-title">Assessment <em>Results</em></h1>

  </div>
  <div class="stats-row" style="grid-template-columns:repeat(4,1fr);margin-bottom:1.4rem">

    <div class="dt-header"><div class="dt-title">All Assessment Results</div>

        <button class="dt-filter ${state.enrollFilter==='passed'?'active':''}" onclick="state.enrollFilter='passed';render()">Passed</button>
        <button class="dt-filter ${state.enrollFilter==='failed'?'active':''}" onclick="state.enrollFilter='failed';render()">Failed</button>
      </div>
    </div>
    <table>
      <thead><tr><th>Student</th><th>Course</th><th>Score</th><th>Result</th><th>Date</th><th>Actions</th></tr></thead>

        ${state.scores.length===0?`<tr><td colspan="6" class="dt-empty">No assessments taken yet.</td></tr>`:
        state.scores

          .map(s=>{
          const stu=state.students.find(st=>st.id===s.user_id);
          const c=COURSE_LIST.find(c=>c.id===s.course_id);
          const cert=state.certificates.find(c=>c.user_id===s.user_id&&c.course_id===s.course_id);
          return `<tr>
            <td><div class="td-name">${stu?.full_name||'?'}</div><div class="td-email">${stu?.email||''}</div></td>
            <td>${c?.icon||''} ${c?.title||s.course_id}</td>
            <td><span style="font-family:'Cinzel',serif;font-size:1.1rem;color:${s.passed?'var(--green)':'var(--red)'}">${s.score}%</span></td>
            <td><span class="td-badge ${s.passed?'badge-passed':'badge-failed'}">${s.passed?'Passed':'Failed'}</span></td>

        course_id: document.getElementById('matCourse').value,

  } else if (type==='uploadPrayer') {

    content=`

        <label class="form-label">Prayer Title *</label>
        <input class="form-input" id="prTitle" value="${ed.title||''}" placeholder="e.g. Monday Prayer — Breaking Fear">

      <div class="form-row">

      <div class="form-group">
        <label class="form-label">Video / Audio URL *</label>

        </div>
      </div>
      <div class="form-group">
        <label class="form-label">Scripture Focus (optional)</label>
        <input class="form-input" id="prScripture" value="${ed.scripture||''}" placeholder='"The Lord is my strength and my shield." — Psalm 28:7'>

      <div class="form-group">
        <label class="form-label">Description (optional)</label>
        <textarea class="form-input" id="prDesc" rows="2" placeholder="Brief description of what this prayer covers…">${ed.desc||''}</textarea>

    </div>
    <div class="modal-footer">
      <button class="btn btn-ghost" onclick="closeModal()">Cancel</button>
      <button class="btn btn-gold" onclick="savePrayer({
        id:'${ed.id||''}',
        title: document.getElementById('prTitle').value,
        type: document.getElementById('prType').value,
        prayer_date: document.getElementById('prDate').value,
        url: document.getElementById('prUrl').value,
        scripture: document.getElementById('prScripture').value,
        desc: document.getElementById('prDesc').value,
      })">Publish Prayer</button>
    </div>`;
    const s=data;
    const enrs=state.enrollments.filter(e=>e.user_id===s.id);
    const scs=state.scores.filter(sc=>sc.user_id===s.id);
    const certs=state.certificates.filter(c=>c.user_id===s.id);
    content=`
    <div class="modal-header"><div class="modal-title">${s.full_name}</div><button class="modal-close" onclick="closeModal()">&#x2715;</button></div>
    <div class="modal-body">
      <div style="display:flex;align-items:center;gap:1rem;margin-bottom:1.4rem;padding-bottom:1.2rem;border-bottom:.5px solid rgba(201,168,76,.12)">
        <div style="width:50px;height:50px;border-radius:50%;background:linear-gradient(135deg,var(--gold-d),var(--gold));display:flex;align-items:center;justify-content:center;font-family:'Cinzel',serif;font-size:1.1rem;color:var(--black);font-weight:700">${s.full_name?.slice(0,2)||'?'}</div>
        <div><div style="font-family:'Cinzel',serif;font-size:13px;color:#fff">${s.full_name}</div><div style="font-family:'EB Garamond',serif;font-size:13px;color:var(--grey-1)">${s.email}</div><div style="font-family:'Cinzel',serif;font-size:8px;letter-spacing:.12em;text-transform:uppercase;color:var(--gold-d);margin-top:2px">Joined ${relTime(s.created_at)}</div></div>
      </div>
      <div style="font-family:'Cinzel',serif;font-size:9px;letter-spacing:.16em;text-transform:uppercase;color:var(--gold);margin-bottom:.7rem">Enrollments (${enrs.length})</div>
      ${enrs.map(e=>{
        const c=COURSE_LIST.find(c=>c.id===e.course_id);
        const sc=state.scores.find(sc=>sc.user_id===s.id&&sc.course_id===e.course_id);
        const cert=state.certificates.find(c=>c.user_id===s.id&&c.course_id===e.course_id);
        return `<div style="display:flex;align-items:center;justify-content:space-between;padding:.6rem;background:rgba(255,255,255,.03);border:.5px solid rgba(201,168,76,.1);border-radius:5px;margin-bottom:.4rem">
          <div>${c?.icon} <span style="font-family:'EB Garamond',serif;font-size:13px;color:rgba(255,255,255,.75)">${c?.title||e.course_id}</span></div>
          <div style="display:flex;gap:.3rem;align-items:center">
            ${sc?`<span class="td-badge ${sc.passed?'badge-passed':'badge-failed'}">${sc.score}%</span>`:''}
            ${cert?`<span class="td-badge badge-cert">&#x1F4DC;</span>`:''}
          </div>
        </div>`;
      }).join('')}
      ${enrs.length===0?'<div style="color:var(--grey-2);font-size:13.5px">No enrollments yet.</div>':''}
    </div>
    <div class="modal-footer">
      <button class="btn btn-ghost" onclick="closeModal()">Close</button>
      <button class="btn btn-gold" onclick="closeModal();openModal('enroll',{userId:'${s.id}'})">+ Enrol in Course</button>
    </div>`;
  } else if (type==='addLecturer') {
    // Edit mode if data.lecturerId passed
    const existing = data?.lecturerId ? (state.lecturers||[]).find(l=>l.id===data.lecturerId) : null;
    content=`
    <div class="modal-header">
      <div class="modal-title">${existing ? 'Edit Lecturer' : 'Assign Lecturer to Course'}</div>
      <button class="modal-close" onclick="closeModal()">&#x2715;</button>
    </div>
    <div class="modal-body">
      <div class="form-group">
        <label class="form-label">Full Name *</label>
        <input class="form-input" id="lecturerName" value="${existing?.name||''}" placeholder="e.g. Dr Sarah Thompson">
      </div>
      <div class="form-group">
        <label class="form-label">Email Address *</label>
        <input class="form-input" id="lecturerEmail" type="email" value="${existing?.email||''}" placeholder="lecturer@email.com">
      </div>
      <div class="form-group">
        <label class="form-label">Link to Student Account (optional)</label>
        <select class="form-select" id="lecturerStudent">
          <option value="">— Select existing student account —</option>
          ${state.students.map(s=>`<option value="${s.id}" ${existing?.userId===s.id?'selected':''}>${s.full_name} (${s.email})</option>`).join('')}
        </select>
        <small style="font-family:'EB Garamond',serif;font-size:12px;color:var(--grey-2);margin-top:.3rem;display:block">Linking to a student account grants them lecturer access in the student portal.</small>
      </div>
      <div class="form-group">
        <label class="form-label">Assign to Course(s) *</label>
        <div style="max-height:220px;overflow-y:auto;border:.5px solid rgba(201,168,76,.14);border-radius:6px;padding:.5rem">
          ${COURSE_LIST.map(c=>`
          <label style="display:flex;align-items:center;gap:.7rem;padding:.45rem .6rem;cursor:pointer;border-radius:4px;transition:background .15s" onmouseover="this.style.background='rgba(201,168,76,.06)'" onmouseout="this.style.background=''">
            <input type="checkbox" name="lecturerCourse" value="${c.id}" ${existing?.courses?.includes(c.id)?'checked':''} style="accent-color:var(--gold);flex-shrink:0">
            <span style="font-family:'EB Garamond',serif;font-size:14px;color:rgba(255,255,255,.75)">${c.icon} ${c.title}</span>
          </label>`).join('')}
        </div>
      </div>
      <div style="background:rgba(224,144,85,.07);border:.5px solid rgba(224,144,85,.22);border-radius:6px;padding:.8rem 1rem">
        <div style="font-family:'Cinzel',serif;font-size:8px;letter-spacing:.14em;text-transform:uppercase;color:#e09055;margin-bottom:.3rem">Important</div>
        <p style="font-family:'EB Garamond',serif;font-size:13px;color:rgba(255,255,255,.6);line-height:1.65">The linked student account will be set to role "lecturer" and will only see course materials for their assigned courses in the Lecturer Portal. Assessment answer keys are visible to admins only.</p>
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn btn-ghost" onclick="closeModal()">Cancel</button>
      ${existing ? `<button class="btn btn-danger btn-sm" onclick="removeLecturer('${existing.id}')">Remove Lecturer</button>` : ''}
      <button class="btn btn-gold" onclick="saveLecturer('${existing?.id||''}')">
        ${existing ? 'Save Changes' : 'Assign Lecturer'}
      </button>
    </div>`;
    const LABS = [
      {id:'alabasterlab',name:'The Alabaster Lab &#x1F3FA;'},
      {id:'forgelab',name:'The Forge Lab &#x2692;'},
      {id:'coupleslab',name:'Couples Vineyard Lab &#x1F347;'},
      {id:'relationshiphub',name:'Relationship Courtyard Hub &#x1F49B;'},
      {id:'bookclub',name:'Book Club Lab &#x1F4DA;'},
    ];
    content=`
    <div class="modal-header"><div class="modal-title">Grant Community Subscription</div><button class="modal-close" onclick="closeModal()">&#x2715;</button></div>
    <div class="modal-body">
      <p style="font-family:'EB Garamond',serif;font-size:14px;color:var(--grey-1);margin-bottom:1.2rem">Manually grant a student access to a £25/month community lab — use this when payment is confirmed via Patreon.</p>
      <div class="form-group">
        <label class="form-label">Select Student *</label>
        <select class="form-select" id="subStudent">
          <option value="">— Select student —</option>
          ${state.students.map(s=>`<option value="${s.id}">${s.full_name} (${s.email})</option>`).join('')}
        </select>
      </div>
      <div class="form-group">
        <label class="form-label">Select Community *</label>
        <select class="form-select" id="subLab">
          ${LABS.map(l=>`<option value="${l.id}" ${data?.labId===l.id?'selected':''}>${l.name} — £25/mo</option>`).join('')}
        </select>
      </div>
      <div style="background:rgba(201,168,76,.06);border:.5px solid rgba(201,168,76,.18);border-radius:6px;padding:.8rem 1rem">
        <p style="font-family:'EB Garamond',serif;font-size:13px;color:rgba(255,255,255,.6)">Confirm Patreon payment before granting access. This grants immediate access to the community lab.</p>
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn btn-ghost" onclick="closeModal()">Cancel</button>
      <button class="btn btn-gold" onclick="grantSubscription(document.getElementById('subStudent').value,document.getElementById('subLab').value)">Grant Access</button>
    </div>`;
  }

  return `<div class="modal-overlay" onclick="if(event.target===this)closeModal()"><div class="modal fade-in">${content}</div></div>`;
}

      ${state.authError?`<div style="background:rgba(224,85,85,.12);border:.5px solid rgba(224,85,85,.3);border-radius:5px;padding:.6rem 1rem;font-family:'EB Garamond',serif;font-size:13px;color:#ff9999;margin-bottom:1rem">${state.authError}</div>`:''}

// ── PAGE: LIBRARY ADMIN ────────────────────────────────────
function renderLibraryAdmin() {
  const items = state.libraryItems.length ? state.libraryItems : LIBRARY_SEED;
  const q = state.libSearch?.toLowerCase()||'';
  let filtered = items;
  if (state.libFilter && state.libFilter!=='all') filtered = filtered.filter(i=>i.type===state.libFilter||i.category===state.libFilter);
  if (q) filtered = filtered.filter(i=>i.title?.toLowerCase().includes(q)||i.category?.toLowerCase().includes(q)||i.desc?.toLowerCase().includes(q)||(i.tags||[]).some(t=>t.toLowerCase().includes(q)));

  const typeLabel={pdf:'PDF',study:'Study',link:'Link',video:'Video',audio:'Audio',article:'Article'};
  const typeIcon={pdf:'&#128196;',study:'&#128218;',link:'&#128279;',video:'&#x1F3A5;',audio:'&#x1F3B5;',article:'&#128221;'};
  const categories = [...new Set(items.map(i=>i.category))];
  const courseGroups = [...new Set(items.filter(i=>i.course).map(i=>i.course))];

  return `
  <div class="pg-header">
    <div class="pg-title-block">
      <div class="pg-crumb">Admin <span>›</span> Resource Library</div>
      <h1 class="pg-title">Resource <em>Library</em></h1>
      <p class="pg-sub">${items.length} items · PDFs, Studies, Links, Videos, Workbooks, Course Materials</p>
    </div>
    <div class="pg-actions">
      <button class="btn btn-outline btn-sm" onclick="openModal('addLibItem',{tab:'link'})">+ Add Link</button>
      <button class="btn btn-outline btn-sm" onclick="openModal('addLibItem',{tab:'study'})">+ Add Study</button>
      <button class="btn btn-gold btn-sm" onclick="openModal('uploadLibItem')">↑ Upload PDF / Video</button>
    </div>
  </div>

  <!-- STATS ROW -->
  <div class="stats-row" style="grid-template-columns:repeat(6,1fr);margin-bottom:1.4rem">
    ${[
      {icon:'&#128196;',val:items.filter(i=>i.type==='pdf').length,lbl:'PDFs'},
      {icon:'&#128218;',val:items.filter(i=>i.type==='study').length,lbl:'Studies'},
      {icon:'&#128279;',val:items.filter(i=>i.type==='link').length,lbl:'Links'},
      {icon:'&#x1F3A5;',val:items.filter(i=>i.type==='video').length,lbl:'Videos'},
      {icon:'&#x1F3B5;',val:items.filter(i=>i.type==='audio').length,lbl:'Audio'},
      {icon:'&#9989;',val:items.filter(i=>i.published!==false).length,lbl:'Published'},
    ].map(s=>`<div class="stat-card"><div class="stat-icon">${s.icon}</div><div class="stat-val">${s.val}</div><div class="stat-label">${s.lbl}</div></div>`).join('')}
  </div>

  <!-- FILTER BAR -->
  <div style="display:flex;align-items:center;gap:.6rem;flex-wrap:wrap;margin-bottom:1.1rem">
    <div style="position:relative;flex:1;min-width:200px;max-width:320px">
      <svg style="position:absolute;left:.65rem;top:50%;transform:translateY(-50%);width:12px;height:12px;color:rgba(255,255,255,.3)" viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.4"><circle cx="6" cy="6" r="4"/><path d="M11 11l-2.5-2.5"/></svg>
      <input class="dt-search" style="padding-left:2.2rem;width:100%" placeholder="Search library…" value="${state.libSearch||''}" oninput="state.libSearch=this.value;render()">
    </div>
    <button class="dt-filter ${!state.libFilter||state.libFilter==='all'?'active':''}" onclick="state.libFilter='all';render()">All</button>
    <button class="dt-filter ${state.libFilter==='pdf'?'active':''}" onclick="state.libFilter='pdf';render()">&#128196; PDFs</button>
    <button class="dt-filter ${state.libFilter==='study'?'active':''}" onclick="state.libFilter='study';render()">&#128218; Studies</button>
    <button class="dt-filter ${state.libFilter==='link'?'active':''}" onclick="state.libFilter='link';render()">&#128279; Links</button>
    <button class="dt-filter ${state.libFilter==='video'?'active':''}" onclick="state.libFilter='video';render()">&#x1F3A5; Video</button>
    <button class="dt-filter ${state.libFilter==='audio'?'active':''}" onclick="state.libFilter='audio';render()">&#x1F3B5; Audio</button>
    ${categories.map(c=>`<button class="dt-filter ${state.libFilter===c?'active':''}" onclick="state.libFilter='${c}';render()">${c}</button>`).join('')}
  </div>

  <!-- LIBRARY GRID -->
  <div class="lib-admin-grid">
    ${filtered.length===0 ? `<div style="grid-column:1/-1;text-align:center;padding:3rem;background:var(--black-3);border:.5px solid rgba(201,168,76,.1);border-radius:9px;color:var(--grey-2);font-family:'EB Garamond',serif">No items found.</div>` :
    filtered.map(item=>`
    <div class="lib-admin-card">
      <div class="lac-thumb">
        <span>${item.icon||typeIcon[item.type]||'&#128196;'}</span>
        <span class="lac-type ${item.type}">${typeLabel[item.type]||item.type}</span>
        ${item.isNew?`<span class="lac-new-dot" title="New"></span>`:''}
        ${item.published===false?`<span style="position:absolute;bottom:.5rem;right:.6rem;font-family:'Cinzel',serif;font-size:7px;letter-spacing:.1em;text-transform:uppercase;padding:2px 7px;border-radius:3px;background:rgba(224,85,85,.2);color:#ff9999;border:.5px solid rgba(224,85,85,.3)">Draft</span>`:''}
      </div>
      <div class="lac-body">
        <div class="lac-cat">${item.category}</div>
        <div class="lac-title">${item.title}</div>
        <div class="lac-desc">${item.desc?.slice(0,110)}${item.desc?.length>110?'…':''}</div>
        ${item.scripture?`<div style="font-family:'Cormorant Garamond',serif;font-style:italic;font-size:12px;color:var(--gold-d);border-left:1.5px solid var(--gold-d);padding-left:7px;line-height:1.5;margin-bottom:.6rem">${item.scripture.slice(0,90)}…</div>`:''}
        ${item.course?`<div style="font-family:'Cinzel',serif;font-size:7px;letter-spacing:.1em;text-transform:uppercase;color:var(--gold-d);margin-bottom:.5rem">&#128218; Linked: ${COURSE_LIST.find(c=>c.id===item.course)?.title||item.course}</div>`:''}
        <div class="lac-tags">${(item.tags||[]).slice(0,3).map(t=>`<span class="lac-tag">${t}</span>`).join('')}</div>
        <div class="lac-footer">
          <button class="td-action btn-sm" onclick="window.open('${item.link||'#'}','_blank')">Open</button>
          <button class="td-action btn-sm" onclick="openModal('editLibItem',${JSON.stringify({...item,desc:(item.desc||'').slice(0,80)}).replace(/"/g,'&quot;')})">Edit</button>
          <button class="td-action danger btn-sm" onclick="deleteLibItem('${item.id}')">Delete</button>
        </div>
      </div>
    </div>`).join('')}
  </div>

  <!-- COURSE MATERIAL SECTION -->
  <div style="margin-top:2rem">
    <div class="sec-hd"><div class="sec-title">Course Material — By Course</div><button class="btn btn-gold btn-sm" onclick="openModal('uploadCourseMaterial')">↑ Upload Course Material</button></div>
    <div class="data-table-wrap">
      <div class="dt-header"><div class="dt-title">Uploaded Course Materials</div></div>
      <table>
        <thead><tr><th>Course</th><th>Material Type</th><th>Title</th><th>Module</th><th>Uploaded</th><th>Actions</th></tr></thead>
        <tbody>
          ${(state.courseMaterials||[]).length===0 ? `
          <tr><td colspan="6">
            <div style="text-align:center;padding:2rem;font-family:'EB Garamond',serif;color:var(--grey-2)">
              No course materials uploaded yet. Use <strong style="color:var(--gold-l)">"Upload Course Material"</strong> to add teaching videos, PDF workbooks, or supplementary resources for each module.
            </div>
          </td></tr>` :
          (state.courseMaterials||[]).map(m=>{
            const c=COURSE_LIST.find(c=>c.id===m.course_id);
            return `<tr>
              <td>${c?.icon||''} <span class="td-name">${c?.title||m.course_id}</span></td>
              <td><span class="td-badge ${m.material_type==='video'?'badge-enrolled':m.material_type==='workbook'?'badge-passed':'badge-pending'}">${m.material_type}</span></td>
              <td>${m.title}</td>
              <td>${m.module_title||'—'}</td>
              <td>${m.created_at?new Date(m.created_at).toLocaleDateString('en-GB',{day:'numeric',month:'short'}):'—'}</td>
              <td><div style="display:flex;gap:.4rem">
                <button class="td-action" onclick="window.open('${m.url}','_blank')">Open</button>
                <button class="td-action danger" onclick="deleteCourseMaterial('${m.id}')">Delete</button>
              </div></td>
            </tr>`;

// ── LIBRARY ACTIONS ────────────────────────────────────────
async function saveLibItem(item) {
  // Merge with existing or add new
  const exists = (state.libraryItems||[]).find(i=>i.id===item.id);
  if (exists) {
    state.libraryItems = state.libraryItems.map(i=>i.id===item.id?{...i,...item}:i);
  } else {
    item.id = item.id || 'lb_'+Date.now();
    item.published = true;
    if (!state.libraryItems) state.libraryItems = [...LIBRARY_SEED];
    state.libraryItems = [item, ...state.libraryItems];
  }
  if (state.supabase) {
    if (exists) await state.supabase.from('library_items').update(item).eq('id',item.id);
    else await state.supabase.from('library_items').insert(item);
  }
  closeModal(); toast('Library item saved!','success'); render();
}

async function deleteLibItem(id) {
  if (!confirm('Delete this library item?')) return;
  if (state.libraryItems?.length) state.libraryItems = state.libraryItems.filter(i=>i.id!==id);
  if (state.supabase) await state.supabase.from('library_items').delete().eq('id',id);
  toast('Item deleted.','info'); render();
}

async function deleteCourseMaterial(id) {
  if (!confirm('Delete this course material?')) return;
  state.courseMaterials = (state.courseMaterials||[]).filter(m=>m.id!==id);
  if (state.supabase) await state.supabase.from('course_materials').delete().eq('id',id);
  toast('Material deleted.','info'); render();
}

async function saveCourseMaterial(mat) {
  mat.id = mat.id||'cm_'+Date.now();
  mat.created_at = new Date().toISOString();
  if (!state.courseMaterials) state.courseMaterials=[];
  state.courseMaterials = [mat,...state.courseMaterials];
  if (state.supabase) await state.supabase.from('course_materials').insert(mat);
  closeModal(); toast('Course material saved!','success'); render();
}

async function savePrayer(prayer) {
  prayer.id = prayer.id||'pr_'+Date.now();
  prayer.active = true;
  prayer.created_at = new Date().toISOString();
  // Deactivate existing active prayer
  if (!state.mondayPrayers) state.mondayPrayers=[];
  state.mondayPrayers = state.mondayPrayers.map(p=>({...p,active:false}));
  state.mondayPrayers = [prayer,...state.mondayPrayers];
  state.currentPrayer = prayer;
  if (state.supabase) {
    await state.supabase.from('monday_prayers').update({active:false}).eq('active',true);
    await state.supabase.from('monday_prayers').insert(prayer);
  }
  closeModal(); toast('Monday Prayer uploaded!','success'); render();
}

async function activatePrayer(id) {
  state.mondayPrayers = (state.mondayPrayers||[]).map(p=>({...p,active:p.id===id}));
  state.currentPrayer = state.mondayPrayers.find(p=>p.id===id);
  if (state.supabase) {
    await state.supabase.from('monday_prayers').update({active:false}).neq('id',id);
    await state.supabase.from('monday_prayers').update({active:true}).eq('id',id);
  }
  toast('Prayer activated!','success'); render();
}

async function deactivatePrayer(id) {
  state.mondayPrayers = (state.mondayPrayers||[]).map(p=>p.id===id?{...p,active:false}:p);
  state.currentPrayer = null;
  if (state.supabase) await state.supabase.from('monday_prayers').update({active:false}).eq('id',id);
  toast('Prayer deactivated.','info'); render();
}

async function deletePrayer(id) {
  if (!confirm('Delete this prayer?')) return;
  state.mondayPrayers = (state.mondayPrayers||[]).filter(p=>p.id!==id);
  if (state.currentPrayer?.id===id) state.currentPrayer=null;
  if (state.supabase) await state.supabase.from('monday_prayers').delete().eq('id',id);
  toast('Prayer deleted.','info'); render();
}

function removeLecturer(lecturerId) {
  if (!confirm('Remove this lecturer? Their student account role will be reset.')) return;
  const lec = (state.lecturers||[]).find(l=>l.id===lecturerId);
  if (lec?.userId && state.supabase) {
    state.supabase.from('profiles').update({role:'student',lecturer_course:null}).eq('id',lec.userId);
  }
  state.lecturers = (state.lecturers||[]).filter(l=>l.id!==lecturerId);
  closeModal();
  toast('Lecturer removed.','info');
  render();
}

async function grantSubscription(userId, labId) {
  if (!userId||!labId) { toast('Please select a member and community.','error'); return; }
  const newSub = {id:'sub'+Date.now(),user_id:userId,lab_id:labId,active:true,amount:25,started_at:new Date().toISOString(),
    profiles:{full_name:studentName(userId),email:state.students.find(s=>s.id===userId)?.email||''}};
  state.allSubscriptions = [newSub,...(state.allSubscriptions||[])];
  if (state.supabase) {
    await state.supabase.from('subscriptions').insert({user_id:userId,lab_id:labId,amount:25,active:true});
  }
  closeModal(); toast('Subscription granted!','success'); render();
}

async function revokeSubscription(subId, userId, labId) {
  if (!confirm('Cancel this subscription?')) return;
  state.allSubscriptions = (state.allSubscriptions||[]).map(s=>s.id===subId?{...s,active:false,cancelled_at:new Date().toISOString()}:s);
  if (state.supabase) await state.supabase.from('subscriptions').update({active:false,cancelled_at:new Date().toISOString()}).eq('id',subId);
  toast('Subscription cancelled.','info'); render();
}

async function reinstateSubscription(subId) {
  state.allSubscriptions = (state.allSubscriptions||[]).map(s=>s.id===subId?{...s,active:true,cancelled_at:null}:s);
  if (state.supabase) await state.supabase.from('subscriptions').update({active:true,cancelled_at:null}).eq('id',subId);
  toast('Subscription reinstated.','success'); render();
}

function exportSubsCSV() {
  const subs = state.allSubscriptions||[];
  const csv = 'Name,Email,Community,Amount,Started,Status\n' +
    subs.map(s=>`"${s.profiles?.full_name||''}","${s.profiles?.email||''}","${s.lab_id}","£${s.amount||25}","${s.started_at?new Date(s.started_at).toLocaleDateString('en-GB'):''}","${s.active?'Active':'Cancelled'}"`).join('\n');
  const blob = new Blob([csv],{type:'text/csv'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a'); a.href=url; a.download='ccc-subscriptions.csv'; a.click();
  URL.revokeObjectURL(url); toast('Subscriptions exported!','success');
}

}

          <option value="community" style="background:#1a1a2e;color:#e8e0cc">&#128172; Community</option>
        </select>
      </div>
    </div>
    <div style="margin-bottom:1rem">
      <label style="font-family:'Cinzel',serif;font-size:7.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--gold-d);display:block;margin-bottom:.35rem">Message *</label>
      <textarea id="notif_body" class="form-input" rows="4" placeholder="Type your notification message here — this will appear on every student's Notifications page…"></textarea>
    </div>
    <div style="display:flex;align-items:center;gap:1rem;flex-wrap:wrap">
      <button class="btn btn-gold" onclick="sendAdminNotification()">Send to All Students →</button>
      <div style="font-family:'EB Garamond',serif;font-size:13px;color:rgba(255,255,255,.45)">Notifications appear immediately on the student platform under Notifications.</div>
    </div>
  </div>

  <!-- SENT NOTIFICATIONS -->
  <div style="font-family:'Cinzel',serif;font-size:8.5px;letter-spacing:.18em;text-transform:uppercase;color:var(--gold);margin-bottom:.8rem">Sent Notifications (${anns.length})</div>
  ${anns.length===0?`<div style="background:var(--black-3);border:.5px solid rgba(201,168,76,.12);border-radius:9px;padding:2rem;text-align:center;font-family:'EB Garamond',serif;font-size:14px;color:rgba(255,255,255,.35)">No notifications sent yet.</div>`:anns.map(n=>{
    const typeColor={info:'#88aaff',success:'#88ddaa',warning:'#f5da82',announcement:'#c9a84c',course:'#88ddaa',certificate:'#f5da82',community:'#ddaaff'}[n.type]||'#c9a84c';
    const typeIcon={info:'&#8505;',success:'&#9989;',warning:'&#9888;',announcement:'&#128226;',course:'&#128218;',certificate:'&#127942;',community:'&#128172;'}[n.type]||'&#128226;';
    return `<div style="background:var(--black-3);border:.5px solid ${typeColor}22;border-radius:9px;padding:1.1rem 1.3rem;margin-bottom:.6rem;display:flex;gap:.9rem;align-items:flex-start">
      <div style="width:36px;height:36px;border-radius:8px;background:${typeColor}18;display:flex;align-items:center;justify-content:center;font-size:1rem;flex-shrink:0">${typeIcon}</div>
      <div style="flex:1">
        <div style="font-family:'Cinzel',serif;font-size:11px;color:#fff;margin-bottom:.25rem">${n.title}</div>
        <div style="font-family:'EB Garamond',serif;font-size:14px;color:rgba(255,255,255,.6);line-height:1.65;margin-bottom:.3rem">${n.body}</div>
        <div style="font-family:'Cinzel',serif;font-size:7.5px;letter-spacing:.1em;text-transform:uppercase;color:rgba(255,255,255,.3)">Sent: ${n.sentAt} · Type: ${n.type} · ID: ${n.id}</div>
      </div>
      <button onclick="deleteAdminNotification('${n.id}')" style="font-family:'Cinzel',serif;font-size:7px;letter-spacing:.1em;text-transform:uppercase;color:#ff9999;border:.5px solid rgba(255,100,100,.2);background:rgba(255,100,100,.06);padding:5px 10px;border-radius:4px;cursor:pointer;flex-shrink:0">Delete</button>
    </div>`;
  }).join('')}`;
}

function sendAdminNotification() {
  const title = document.getElementById('notif_title')?.value?.trim();
  const body = document.getElementById('notif_body')?.value?.trim();
  const type = document.getElementById('notif_type')?.value || 'announcement';
  if (!title || !body) { toast('Please fill in title and message', 'error'); return; }
  const notif = {
    id: 'notif_' + Date.now(),
    title, body, type,
    sentAt: new Date().toLocaleDateString('en-GB',{day:'numeric',month:'long',year:'numeric',hour:'2-digit',minute:'2-digit'}),
    from: 'CCC Formation Centre',
    read: false,
  };
  // Add to admin sent list
  if (!state.announcements) state.announcements = [];
  state.announcements.push(notif);
  // Push to student-facing notifications (shared state)
  // In production this would go to DB; here we use the same state object
  if (!state.notifications) state.notifications = [];
  state.notifications.push({...notif});
  // Clear form
  document.getElementById('notif_title').value = '';
  document.getElementById('notif_body').value = '';
  toast('&#9989; Notification sent to all students!', 'success');
  render();
}

function deleteAdminNotification(id) {
  state.announcements = (state.announcements||[]).filter(n=>n.id!==id);
  state.notifications = (state.notifications||[]).filter(n=>n.id!==id);
  toast('Notification deleted', 'info');
  render();
}
  function renderCoreTrainingAdmin(){
    var coreCourses=COURSE_LIST.filter(function(c){return c.core;});
    var coreIds=coreCourses.map(function(c){return c.id;});
    var coreEnrolled=(state.enrollments||[]).filter(function(e){return coreIds.indexOf(e.course_id)>=0;});
    var coreCerts=(state.certificates||[]).filter(function(x){return coreIds.indexOf(x.course_id)>=0;});
    var totalMods=coreCourses.reduce(function(a,c){return a+(c.mods||0);},0);
    var h="";
    h+='<div class="pg-header"><div class="pg-title-block">';
    h+='<div class="pg-crumb">Admin &rsaquo; Core Training</div>';
    h+='<h1 class="pg-title">Core <em>Training</em></h1>';
    h+='<p class="pg-sub">7 sequential courses. Students must score 70%+ on every assessment to progress.</p>';
    h+='</div></div>';
    // Stats
    h+='<div class="stats-row" style="margin-bottom:1.8rem">';
    h+='<div class="stat-card"><div class="stat-num">'+coreCourses.length+'</div><div class="stat-label">Courses</div></div>';
    h+='<div class="stat-card"><div class="stat-num">'+totalMods+'</div><div class="stat-label">Total Modules</div></div>';
    h+='<div class="stat-card"><div class="stat-num">'+coreEnrolled.length+'</div><div class="stat-label">Enrollments</div></div>';
    h+='<div class="stat-card"><div class="stat-num">'+coreCerts.length+'</div><div class="stat-label">Certificates</div></div>';
    h+='</div>';
    // Course cards
    h+='<div class="sec-hd"><div class="sec-title">Course Overview</div></div>';
    h+='<div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:1rem;margin-bottom:1.8rem">';
    coreCourses.forEach(function(co,idx){
      var en=coreEnrolled.filter(function(e){return e.course_id===co.id;}).length;
      var ce=coreCerts.filter(function(x){return x.course_id===co.id;}).length;
      h+='<div class="card" style="position:relative;overflow:hidden">';
      h+='<div style="position:absolute;top:0;left:0;right:0;height:2px;background:linear-gradient(to right,transparent,var(--gold),transparent)"></div>';
      h+='<div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:.5rem">';
      h+='<span style="font-family:var(--font-heading);font-size:7.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--gold)">Course '+( idx+1)+' of '+coreCourses.length+'</span>';
      h+=co.mods?'<span class="badge badge-info">'+co.mods+' modules</span>':"";
      h+='</div>';
      h+='<div style="font-size:1.5rem;margin-bottom:.3rem">'+co.icon+'</div>';
      h+='<div style="font-family:var(--font-heading);font-size:.95rem;color:var(--text-1);margin-bottom:.25rem">'+co.title+'</div>';
      h+='<div style="font-size:12px;color:var(--text-3);margin-bottom:.65rem">'+co.school+'</div>';
      h+='<div style="display:flex;gap:.4rem">';
      h+='<span class="badge badge-neutral">'+en+' enrolled</span>';
      h+='<span class="badge '+( ce>0?"badge-success":"badge-neutral")+'">'+ce+' certs</span>';
      h+='</div></div>';
    });
    h+='</div>';
    // Student table
    h+='<div class="sec-hd"><div class="sec-title">Student Progress</div></div>';
    h+='<div class="table-wrap"><table class="data-table">';
    h+='<thead><tr><th>Student</th><th>Email</th><th>Courses</th><th>Certs</th><th>Joined</th></tr></thead><tbody>';
    var students=state.students||[];
    if(students.length===0){
      h+='<tr><td colspan="5" class="dt-empty">No students yet. Students appear here once they register.</td></tr>';
    } else {
      students.slice(0,25).forEach(function(s){
        var se2=coreEnrolled.filter(function(e){return e.user_id===s.id;}).length;
        var sc2=coreCerts.filter(function(x){return x.user_id===s.id;}).length;
        h+='<tr>';
        h+='<td><div class="student-cell"><div class="avatar-sm">'+s.full_name.charAt(0)+'</div><div class="student-name">'+s.full_name+'</div></div></td>';
        h+='<td style="font-size:12px;color:var(--text-3)">'+s.email+'</td>';
        h+='<td>'+se2+'/'+coreCourses.length+'</td>';
        h+='<td><span class="badge '+( sc2>0?"badge-success":"badge-neutral")+'">'+sc2+'</span></td>';
        h+='<td style="font-size:12px;color:var(--text-3)">'+relTime(s.created_at)+'</td>';
        h+='</tr>';
      });
    }
    h+='</tbody></table></div>';
    return h;
  }
</script>
